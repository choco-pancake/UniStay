server {
    listen 8080;
    root /var/www/html;
    index index.php;

    # Nginx does not read the access rules in the project's .htaccess files.
    location ~* ^/(?:data|database|storage|config|vendor)(?:/|$) {
        return 403;
    }

    # Uploads may be served as files, but never executed or exposed as scripts.
    location ~* ^/(?:uploads|tenant/uploads)/.*\.(?:php|phtml|php3|php4|php5|php7|phps|phar|cgi|pl|exe|sh|py|rb|bat|cmd)(?:/|$) {
        return 403;
    }

    location ~ /\. {
        return 403;
    }

    location ~* \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
